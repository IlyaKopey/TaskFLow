<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>TaskFlow</h1>
        <p>Твой личный менеджер задач</p>
        <img src="images/logo.png" alt="Логотип TaskFlow" width="200">
    </header>
    <main>
        <section class="task_section">
            <h2>Мои задачи</h2>
            <ul>
                <li class="task_item">
                    <input type="checkbox" id="task1">
                    <label for="task1">Изучить HTML</label>
                </li>
                <li class="task_item">
                    <input type="checkbox" id="task2">
                    <label for="task2">Повторить Python</label>
                </li>
                <li class="task_item">
                    <input type="checkbox" id="task3">
                    <label for="task3">Позаниматься Английским</label>
                    
                </li>
            </ul>
            <button type="button">Добавить задачу</button>
        </section>
        <form>
            <fieldset>
                <legend>Информация о задаче</legend>
                <label for="task_name">Название задачи</label>
                
                <input
                    type="text"
                    id="task_name"
                    name="task_name"
                    placeholder="Например, изучить HTML"
                    required
                >

                <label for="task_date">Срок выполнения</label>

                <input
                    type="date"
                    id="task_date"
                    name="task_date"
                    required
                >
    
                <label for="task_category">Категория задачи</label>

                <select class="task_category" id="task_category" name="task_category">
                    <option value="html">Изучение HTML</option>
                    <option value="english">Занятия Английским</option>
                    <option value="programming">Программирование</option>
                    <option value="other">Разное</option>
                </select>

                <label for="task_description">Описание задачи</label>

                <textarea 
                    id="task_description"
                    name="task_description"
                    placeholder="Опиши задачу"
                    rows="4"
                ></textarea>

                
            </fieldset>      
        <button type="submit">Создать задачу</button>    
        </form>

    </main>
    <footer>
        <p>TaskFlow © Ilya Kopeykin</p>
        <nav>
            <a href="https://github.com/IlyaKopey/TaskFLow" target="_blank" rel="noopener noreferrer">
                Репозиторий проекта TaskFlow
            </a>
            <a href="https://github.com/IlyaKopey" target="_blank" rel="noopener noreferrer">
                Профиль автора TaskFlow
            </a>
        </nav>
    </footer>
</body>
</html>
