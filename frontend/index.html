<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
</head>
<body>
    <header>
        <h1>TaskFlow</h1>
        <p>Твой личный менеджер задач</p>
    </header>
    <main>
        <section>
            <h2>Мои задачи</h2>
            <ul>
                <li>Изучить HTML</li>
                <li>Повторить Python</li>
                <li>Позаниматься Английским</li>
            </ul>
            <button type="button">Добавить задачу</button>
        </section>
        <form>
            <label for="task_name">Название задачи</label>

            <input
                type="text"
                id="task_name"
                name="task_name"
                placeholder="Например, изучить HTML"
                required
            >

            <label for="task_date">Срок выполнения</label>

            <input
                type="date"
                id="task_date"
                name="task_date"
                required
            >
  
            <label for="task_category">Категории задач</label>

            <select id="task_category" name="task_category">
                <option value="html">Изучение HTML</option>
                <option value="english">Занятия Английским</option>
                <option value="programming">Программирование</option>
                <option value="other">Разное</option>
            </select>
            <button type="submit">Создать задачу</button>  
        </form>

    </main>
    <footer>
        <p>TaskFlow © Ilya Kopeykin</p>
    </footer>
</body>
</html>
